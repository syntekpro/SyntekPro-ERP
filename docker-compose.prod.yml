name: ${COMPOSE_PROJECT_NAME:-erp}

# ------------------------------------------------------------------
# PRODUCTION STACK — do not run `docker compose` commands against this
# file by hand (up/down/recreate) outside of the Update Now flow or an
# incident you are deliberately debugging. Manual recreation bypasses
# the updater's image checks, database backup, and health-check/rollback
# safety net in docker/updater/UpdateEngine.php, and can tear down
# containers with no verified replacement image.
#
# Volume names below (erp-db, erp-redis) are load-bearing: renaming a
# volume key here does NOT migrate data, it silently starts a fresh
# empty volume under the new name while the old data sits orphaned.
# Never rename these without an explicit data-migration step.
# ------------------------------------------------------------------

services:
  app:
    image: ghcr.io/syntekpro/syntekpro-erp:${SYNTEK_IMAGE_TAG:-latest}
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - internal
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8082}:80"
    networks:
      - internal
      - erp-net
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-erp_demo}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-erp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - erp-db:/var/lib/mysql
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - erp-redis:/data
    networks:
      - internal
    restart: unless-stopped

  updater:
    build:
      context: ./docker/updater
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-erp}-updater
    environment:
      UPDATER_API_TOKEN: ${UPDATER_API_TOKEN}
      SYNTEK_VERSION: ${SYNTEK_VERSION:-unknown}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./:/project:rw
    networks:
      - internal
    restart: unless-stopped

volumes:
  erp-db:
  erp-redis:
  app-storage:

networks:
  internal:
    driver: bridge
  erp-net:
    external: true
    name: erp-net
